<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-labelledby="title desc"><title id="title">BlackF1re systems terminal</title><desc id="desc">Animated engineering terminal and controller board representing Linux, embedded systems, sensors, networks and automation.</desc><style>:root{--bg:#f6f8fa;--panel:#fff;--border:#d0d7de;--text:#1f2328;--muted:#656d76;--accent:#0969da;--ok:#1a7f37;--chip:#eaeef2}@media(prefers-color-scheme:dark){:root{--bg:#0d1117;--panel:#161b22;--border:#30363d;--text:#e6edf3;--muted:#8b949e;--accent:#58a6ff;--ok:#3fb950;--chip:#21262d}}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace}.trace{fill:none;stroke:var(--accent);stroke-width:2;stroke-linecap:round;stroke-dasharray:8 13;animation:flow 2.8s linear infinite;opacity:.55}.pulse{animation:pulse 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.l1{animation:reveal 10s ease-in-out infinite}.l2{animation:reveal 10s ease-in-out 1.1s infinite;opacity:0}.l3{animation:reveal 10s ease-in-out 2.2s infinite;opacity:0}.l4{animation:reveal 10s ease-in-out 3.3s infinite;opacity:0}.l5{animation:reveal 10s ease-in-out 4.4s infinite;opacity:0}.cursor{animation:blink 1s steps(2,end) infinite}.scan{animation:scan 4s ease-in-out infinite}@keyframes flow{to{stroke-dashoffset:-42}}@keyframes pulse{0%,100%{opacity:.4;transform:scale(.92)}50%{opacity:1;transform:scale(1.08)}}@keyframes reveal{0%,8%{opacity:0;transform:translateY(4px)}14%,82%{opacity:1;transform:translateY(0)}92%,100%{opacity:0}}@keyframes blink{0%,45%{opacity:1}46%,100%{opacity:0}}@keyframes scan{0%,100%{transform:translateY(-55px);opacity:0}15%{opacity:.45}50%{transform:translateY(55px);opacity:.2}85%{opacity:.45}}</style><rect x="1" y="1" width="998" height="298" rx="18" fill="var(--bg)" stroke="var(--border)"/><rect x="22" y="22" width="956" height="256" rx="13" fill="var(--panel)" stroke="var(--border)"/><circle cx="45" cy="44" r="5" fill="var(--muted)" opacity=".55"/><circle cx="63" cy="44" r="5" fill="var(--muted)" opacity=".38"/><circle cx="81" cy="44" r="5" fill="var(--muted)" opacity=".24"/><text x="105" y="49" class="mono" font-size="13" fill="var(--muted)">blackf1re@systems-lab:~</text><line x1="22" y1="65" x2="978" y2="65" stroke="var(--border)"/><g class="mono" font-size="17"><text x="50" y="100" fill="var(--text)" class="l1"><tspan fill="var(--accent)">$</tspan> system status</text><text x="50" y="132" fill="var(--text)" class="l2"><tspan fill="var(--ok)">[ok]</tspan> linux / embedded / devices</text><text x="50" y="164" fill="var(--text)" class="l3"><tspan fill="var(--ok)">[ok]</tspan> sensors / fpga / interfaces</text><text x="50" y="196" fill="var(--text)" class="l4"><tspan fill="var(--ok)">[ok]</tspan> networks / tools / automation</text><text x="50" y="228" fill="var(--text)" class="l5"><tspan fill="var(--accent)">&gt;</tspan> build - measure - improve</text><rect x="306" y="213" width="10" height="18" rx="1" fill="var(--accent)" class="cursor"/></g><g transform="translate(600 100)"><path class="trace" d="M-62 30H0M-62 70H0M-62 110H0M210 30H264M210 70H264M210 110H264M55-24V0M105-24V0M155-24V0M55 140V164M105 140V164M155 140V164"/><rect width="210" height="140" rx="10" fill="var(--chip)" stroke="var(--border)"/><rect x="49" y="31" width="112" height="78" rx="8" fill="var(--panel)" stroke="var(--accent)" stroke-width="2"/><text x="105" y="58" class="mono" text-anchor="middle" font-size="12" fill="var(--muted)">SYSTEMS LAB</text><text x="105" y="82" class="mono" text-anchor="middle" font-size="17" font-weight="700" fill="var(--text)">BLACKF1RE</text><text x="105" y="100" class="mono" text-anchor="middle" font-size="10" fill="var(--accent)">HW &lt;-&gt; SW</text><circle cx="25" cy="22" r="4" fill="var(--ok)" class="pulse"/><circle cx="185" cy="118" r="4" fill="var(--accent)" class="pulse" style="animation-delay:1.1s"/><line x1="15" y1="70" x2="195" y2="70" stroke="var(--accent)" stroke-width="1" opacity=".25" class="scan"/></g><g class="mono" font-size="10" fill="var(--muted)"><text x="535" y="132">UART</text><text x="535" y="172">I2C</text><text x="535" y="212">SPI</text><text x="822" y="132">NET</text><text x="822" y="172">USB</text><text x="822" y="212">GPIO</text></g></svg>