name: Generate profile activity

on:
  schedule:
    - cron: "*/5 * * * *"
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/snake.yml"

permissions:
  contents: write

concurrency:
  group: profile-activity
  cancel-in-progress: true

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Check out profile repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Point README at live counters
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          path = Path("README.md")
          text = path.read_text(encoding="utf-8")
          old = "https://img.shields.io/github/followers/BlackF1re?style=flat-square&color=2f81f7&label=followers"
          new = "https://img.shields.io/endpoint?url=https%3A%2F%2Fraw.githubusercontent.com%2FBlackF1re%2FBlackF1re%2Foutput%2Ffollowers.json&style=flat-square"

          if old in text:
              path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

          if git diff --quiet -- README.md; then
            echo "README already uses the live follower counter."
          else
            git config user.name "BlackF1re"
            git config user.email "55582873+BlackF1re@users.noreply.github.com"
            git add README.md
            git commit -m "fix: refresh follower counter promptly"
            git push origin HEAD:main
          fi

      - name: Build live counters
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist

          followers="$(gh api '/users/BlackF1re' --jq '.followers')"
          stars="$(gh api --paginate '/users/BlackF1re/repos?type=owner&per_page=100' --jq '.[].stargazers_count' | awk '{sum += $1} END {print sum + 0}')"

          printf '{"schemaVersion":1,"label":"followers","message":"%s","color":"2f81f7","namedLogo":"github","cacheSeconds":300}\n' "$followers" > dist/followers.json
          printf '{"schemaVersion":1,"label":"stars","message":"%s","color":"2f81f7","namedLogo":"github","cacheSeconds":300}\n' "$stars" > dist/stars.json

          echo "Followers: $followers"
          echo "Total public repository stars: $stars"

      - name: Publish counters when changed
        shell: bash
        run: |
          set -euo pipefail
          tmp_dir="$(mktemp -d)"
          cp dist/followers.json dist/stars.json "$tmp_dir/"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin output >/dev/null 2>&1; then
            git fetch origin output:refs/remotes/origin/output
            git checkout -B output origin/output
          else
            git checkout --orphan output
            git rm -rf . >/dev/null 2>&1 || true
          fi

          cp "$tmp_dir"/* .
          git add followers.json stars.json

          if git diff --cached --quiet; then
            echo "Profile counters are already up to date."
            exit 0
          fi

          git commit -m "chore: update profile counters"
          git push origin output

  generate:
    needs: metrics
    if: github.event_name != 'schedule' || github.event.schedule == '17 3 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out profile repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate contribution animation
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3.5.0
        with:
          github_user_name: BlackF1re
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-light&color_snake=#2f81f7
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#58a6ff

      - name: Polish animation
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          def keyframe_block(svg, name):
              marker = f"@keyframes {name}{{"
              start = svg.find(marker)
              if start < 0:
                  return None

              body_start = start + len(marker)
              depth = 1
              pos = body_start
              while pos < len(svg) and depth:
                  if svg[pos] == "{":
                      depth += 1
                  elif svg[pos] == "}":
                      depth -= 1
                  pos += 1

              if depth != 0:
                  return None

              body = svg[body_start:pos - 1]
              points = {}
              for selectors, x, y in re.findall(
                  r'([0-9.,%]+)\{transform:translate\(([-0-9.]+)px,([-0-9.]+)px\)\}',
                  body,
              ):
                  for selector in selectors.split(","):
                      selector = selector.strip().rstrip("%")
                      if selector:
                          points[float(selector)] = (float(x), float(y))

              return marker, start, pos, points

          def sample(points, pct):
              ordered = sorted(points)
              before = [p for p in ordered if p <= pct]
              after = [p for p in ordered if p >= pct]
              if not before or not after:
                  raise ValueError(f"Cannot sample keyframes at {pct}%")

              p0 = before[-1]
              p1 = after[0]
              x0, y0 = points[p0]
              x1, y1 = points[p1]
              if abs(p1 - p0) < 1e-9:
                  return x0, y0

              t = (pct - p0) / (p1 - p0)
              return x0 + (x1 - x0) * t, y0 + (y1 - y0) * t

          def fmt(value):
              return f"{round(value, 2):g}"

          def rewrite_exit(svg, name, exit_start, turn_at, fade_end, turn_pos, end_pos):
              parsed = keyframe_block(svg, name)
              if not parsed:
                  return svg

              marker, start, pos, points = parsed
              current = sample(points, exit_start)
              rebuilt = []

              for pct in sorted(points):
                  if pct >= exit_start:
                      break
                  x, y = points[pct]
                  rebuilt.append(
                      f"{pct:g}%{{transform:translate({fmt(x)}px,{fmt(y)}px)}}"
                  )

              rebuilt.append(
                  f"{exit_start:g}%{{transform:translate({fmt(current[0])}px,{fmt(current[1])}px)}}"
              )
              rebuilt.append(
                  f"{turn_at:g}%{{transform:translate({fmt(turn_pos[0])}px,{fmt(turn_pos[1])}px)}}"
              )
              rebuilt.append(
                  f"{fade_end:g}%,100%{{transform:translate({fmt(end_pos[0])}px,{fmt(end_pos[1])}px)}}"
              )

              replacement = marker + "".join(rebuilt) + "}"
              return svg[:start] + replacement + svg[pos:]

          for path in Path("dist").glob("github-contribution-grid-snake*.svg"):
              svg = path.read_text(encoding="utf-8")

              svg = re.sub(
                  r'viewBox="-16 -32 ([0-9.]+) 192" width="([0-9.]+)" height="192"',
                  r'viewBox="-16 0 \1 160" width="\2" height="160"',
                  svg,
                  count=1,
              )

              svg = re.sub(r'<rect class="s s3"[^>]*/>', '', svg, count=1)

              marks = [
                  float(value)
                  for value in re.findall(
                      r'@keyframes c[0-9a-z]+\{([0-9.]+)%\{fill:', svg
                  )
              ]
              duration = re.search(
                  r'\.s\{[^}]*animation:none linear ([0-9]+)ms infinite', svg
              )

              if marks and duration:
                  exit_start = min(max(marks) + 0.02, 88.0)
                  turn_at = min(exit_start + 0.45, 89.0)
                  fade_end = min(exit_start + 9.0, 94.0)

                  poses = {}
                  for name in ("s0", "s1", "s2"):
                      parsed = keyframe_block(svg, name)
                      if parsed:
                          poses[name] = sample(parsed[3], exit_start)

                  if len(poses) == 3:
                      head_x, head_y = poses["s0"]
                      turn_positions = {
                          "s0": (head_x - 16.0, head_y),
                          "s1": (head_x, head_y),
                          "s2": (head_x + 16.0, head_y),
                      }
                      end_positions = {
                          "s0": (0.0, head_y),
                          "s1": (16.0, head_y),
                          "s2": (32.0, head_y),
                      }

                      for name in ("s0", "s1", "s2"):
                          svg = rewrite_exit(
                              svg,
                              name,
                              exit_start,
                              turn_at,
                              fade_end,
                              turn_positions[name],
                              end_positions[name],
                          )

                      snake = re.search(
                          r'(<rect class="s s0"[^>]*/><rect class="s s1"[^>]*/><rect class="s s2"[^>]*/>)',
                          svg,
                      )
                      if snake:
                          group = '<g class="visible-snake">' + snake.group(1) + '</g>'
                          svg = svg[:snake.start()] + group + svg[snake.end():]

                          visibility = (
                              '@keyframes snakeVisibility{'
                              f'0%,{exit_start:g}%{{opacity:1}}'
                              f'{fade_end:g}%,100%{{opacity:0}}'
                              '}'
                              f'.visible-snake{{animation:snakeVisibility {duration.group(1)}ms linear infinite}}'
                          )
                          svg = svg.replace('</style>', visibility + '</style>', 1)

              path.write_text(svg, encoding="utf-8")
          PY

      - name: Publish generated animation
        shell: bash
        run: |
          set -euo pipefail
          tmp_dir="$(mktemp -d)"
          cp dist/github-contribution-grid-snake*.svg "$tmp_dir/"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin output:refs/remotes/origin/output
          git checkout -B output origin/output

          cp "$tmp_dir"/* .
          git add github-contribution-grid-snake*.svg

          if git diff --cached --quiet; then
            echo "Contribution animation is already up to date."
            exit 0
          fi

          git commit -m "chore: update profile activity"
          git push origin output
