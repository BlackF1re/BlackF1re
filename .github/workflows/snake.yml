name: Generate profile activity

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/snake.yml"

permissions:
  contents: write

concurrency:
  group: profile-activity
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out profile repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate contribution animation
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3.5.0
        with:
          github_user_name: BlackF1re
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-light&color_snake=#2f81f7
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#58a6ff

      - name: Polish animation and build counters
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          def rewrite_keyframes(svg, name, freeze_at, hold_until=93.0):
              marker = f"@keyframes {name}{{"
              start = svg.find(marker)
              if start < 0:
                  return svg

              body_start = start + len(marker)
              depth = 1
              pos = body_start
              while pos < len(svg) and depth:
                  if svg[pos] == "{":
                      depth += 1
                  elif svg[pos] == "}":
                      depth -= 1
                  pos += 1

              if depth != 0:
                  return svg

              body = svg[body_start:pos - 1]
              points = {}
              for selectors, x, y in re.findall(
                  r'([0-9.,%]+)\{transform:translate\(([-0-9.]+)px,([-0-9.]+)px\)\}',
                  body,
              ):
                  for selector in selectors.split(","):
                      selector = selector.strip().rstrip("%")
                      if selector:
                          points[float(selector)] = (float(x), float(y))

              ordered = sorted(points)
              before = [p for p in ordered if p <= freeze_at]
              after = [p for p in ordered if p >= freeze_at]
              if not before or not after:
                  return svg

              p0 = before[-1]
              p1 = after[0]
              x0, y0 = points[p0]
              x1, y1 = points[p1]

              if abs(p1 - p0) < 1e-9:
                  frozen_x, frozen_y = x0, y0
              else:
                  t = (freeze_at - p0) / (p1 - p0)
                  frozen_x = x0 + (x1 - x0) * t
                  frozen_y = y0 + (y1 - y0) * t

              def n(value):
                  rounded = round(value, 2)
                  return f"{rounded:g}"

              rebuilt = []
              for pct in ordered:
                  if pct >= freeze_at:
                      break
                  x, y = points[pct]
                  rebuilt.append(
                      f"{pct:g}%{{transform:translate({n(x)}px,{n(y)}px)}}"
                  )

              frozen = f"transform:translate({n(frozen_x)}px,{n(frozen_y)}px)"
              rebuilt.append(f"{freeze_at:g}%{{{frozen}}}")
              rebuilt.append(f"{hold_until:g}%,100%{{{frozen}}}")

              replacement = marker + "".join(rebuilt) + "}"
              return svg[:start] + replacement + svg[pos:]

          for path in Path("dist").glob("github-contribution-grid-snake*.svg"):
              svg = path.read_text(encoding="utf-8")

              # Three visible segments make tight turns cleaner and keep the head
              # from visually touching the tail on compact manoeuvres.
              svg = re.sub(r'<rect class="s s3"[^>]*/>', '', svg, count=1)

              marks = [
                  float(value)
                  for value in re.findall(
                      r'@keyframes c[0-9a-z]+\{([0-9.]+)%\{fill:', svg
                  )
              ]
              duration = re.search(
                  r'\.s\{[^}]*animation:none linear ([0-9]+)ms infinite', svg
              )

              if marks and duration:
                  # Freeze at the exact pose just after the last contribution is
                  # eaten. Each body segment is linearly interpolated at that point,
                  # preserving the snake shape instead of collapsing the segments.
                  freeze_at = min(max(marks) + 0.04, 88.0)
                  for name in ("s0", "s1", "s2"):
                      svg = rewrite_keyframes(svg, name, freeze_at)

                  snake = re.search(
                      r'(<rect class="s s0"[^>]*/><rect class="s s1"[^>]*/><rect class="s s2"[^>]*/>)',
                      svg,
                  )
                  if snake:
                      group = '<g class="visible-snake">' + snake.group(1) + '</g>'
                      svg = svg[:snake.start()] + group + svg[snake.end():]

                      visibility = (
                          '@keyframes snakeVisibility{'
                          '0%,1.5%{opacity:0}'
                          '3%,93%{opacity:1}'
                          '98%,100%{opacity:0}'
                          '}'
                          f'.visible-snake{{animation:snakeVisibility {duration.group(1)}ms linear infinite}}'
                      )
                      svg = svg.replace('</style>', visibility + '</style>', 1)

              path.write_text(svg, encoding="utf-8")
          PY

          stars="$(gh api --paginate '/users/BlackF1re/repos?type=owner&per_page=100' --jq '.[].stargazers_count' | awk '{sum += $1} END {print sum + 0}')"
          printf '{"schemaVersion":1,"label":"stars","message":"%s","color":"2f81f7","logo":"github"}\n' "$stars" > dist/stars.json
          echo "Total public repository stars: $stars"

      - name: Publish generated assets
        shell: bash
        run: |
          set -euo pipefail
          tmp_dir="$(mktemp -d)"
          cp dist/github-contribution-grid-snake*.svg dist/stars.json "$tmp_dir/"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin output >/dev/null 2>&1; then
            git fetch origin output:refs/remotes/origin/output
            git checkout -B output origin/output
          else
            git checkout --orphan output
            git rm -rf . >/dev/null 2>&1 || true
          fi

          cp "$tmp_dir"/* .
          git add github-contribution-grid-snake*.svg stars.json

          if git diff --cached --quiet; then
            echo "Profile activity assets are already up to date."
            exit 0
          fi

          git commit -m "chore: update profile activity"
          git push origin output
