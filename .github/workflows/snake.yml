name: Generate profile activity

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/snake.yml"

permissions:
  contents: write

concurrency:
  group: profile-activity
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out profile repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate contribution animation
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3.5.0
        with:
          github_user_name: BlackF1re
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-light&color_snake=#2f81f7
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#58a6ff

      - name: Polish animation and build counters
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          for path in Path("dist").glob("github-contribution-grid-snake*.svg"):
              svg = path.read_text(encoding="utf-8")

              # Keep the technical return path outside the visible canvas.
              svg = re.sub(
                  r'viewBox="-16 -32 ([0-9.]+) 192" width="([0-9.]+)" height="192"',
                  r'viewBox="-16 0 \1 160" width="\2" height="160"',
                  svg,
                  count=1,
              )

              # A three-segment visible snake makes tight turns cleaner and avoids
              # the tail visually touching the head on narrow return paths.
              svg = re.sub(r'<rect class="s s3"[^>]*/>', '', svg, count=1)

              # snk appends a route back to its initial pose after the last cell.
              # Fade the snake immediately after the final contribution is eaten,
              # so only the meaningful route is visible.
              marks = [
                  float(value)
                  for value in re.findall(
                      r'@keyframes c[0-9a-z]+\{([0-9.]+)%\{fill:', svg
                  )
              ]
              duration = re.search(
                  r'\.s\{[^}]*animation:none linear ([0-9]+)ms infinite', svg
              )
              snake = re.search(
                  r'(<rect class="s s0"[^>]*/><rect class="s s1"[^>]*/><rect class="s s2"[^>]*/>)',
                  svg,
              )

              if marks and duration and snake:
                  fade_start = min(max(marks) + 0.15, 98.0) / 100.0
                  fade_end = min(max(marks) + 0.80, 99.0) / 100.0
                  group = (
                      '<g class="visible-snake">'
                      + snake.group(1)
                      + '<animate attributeName="opacity" values="1;1;0;0" '
                      + f'keyTimes="0;{fade_start:.4f};{fade_end:.4f};1" '
                      + f'dur="{duration.group(1)}ms" repeatCount="indefinite"/>'
                      + '</g>'
                  )
                  svg = svg[: snake.start()] + group + svg[snake.end() :]

              path.write_text(svg, encoding="utf-8")
          PY

          stars="$(gh api --paginate '/users/BlackF1re/repos?type=owner&per_page=100' --jq '.[].stargazers_count' | awk '{sum += $1} END {print sum + 0}')"
          printf '{"schemaVersion":1,"label":"stars","message":"%s","color":"2f81f7","logo":"github"}\n' "$stars" > dist/stars.json
          echo "Total public repository stars: $stars"

      - name: Publish generated assets
        shell: bash
        run: |
          set -euo pipefail
          tmp_dir="$(mktemp -d)"
          cp dist/github-contribution-grid-snake*.svg dist/stars.json "$tmp_dir/"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin output >/dev/null 2>&1; then
            git fetch origin output:refs/remotes/origin/output
            git checkout -B output origin/output
          else
            git checkout --orphan output
            git rm -rf . >/dev/null 2>&1 || true
          fi

          cp "$tmp_dir"/* .
          git add github-contribution-grid-snake*.svg stars.json

          if git diff --cached --quiet; then
            echo "Profile activity assets are already up to date."
            exit 0
          fi

          git commit -m "chore: update profile activity"
          git push origin output
